name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa-medusajs_ecomerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      # Chromium only — the suite is written against Chrome.
      run: npx playwright install --with-deps chromium

    - name: Prepare backend environment
      working-directory: apps/backend
      run: |
        cp .env.template .env
        {
          echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/medusa-medusajs_ecomerce"
          echo "REDIS_URL=redis://localhost:6379"
        } >> .env

    - name: Run database migrations
      working-directory: apps/backend
      run: npx medusa db:migrate

    - name: Start the backend
      working-directory: apps/backend
      run: |
        npx medusa develop &
        npx wait-on http://localhost:9000/health --timeout=180000

    - name: Start the storefront
      working-directory: apps/storefront
      env:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_750f454742d6c02d050aa67fd2b607a40da558cac02ee40da898779dc81a968c
      run: |
        npm run dev &
        npx wait-on http://localhost:8000/vn --timeout=180000

    - name: Run Playwright tests
      run: npx playwright test tests/auto --project=chromium

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-test-results
        path: test-results/
        retention-days: 7
